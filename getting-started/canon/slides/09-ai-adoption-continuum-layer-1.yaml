speaker_notes: >-
  Think about AI adoption as modes of transport. The 95% who see no gains are at biking and driving,
  having bought tools and called it transformation. Driving is still ground transport, the same work
  done faster. Everything above helicopter is a different process rather than a faster car, and
  that's where the outsized results live.
