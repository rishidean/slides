speaker_notes: >-
  The Builder, and it's nothing exotic: one Claude Code session, spun up fresh for exactly one
  sprint, then thrown away. It reads the context, writes the code, checks its own work, and hands
  off. The leverage is the clean brain; every sprint starts with no accumulated confusion from the
  last one.
