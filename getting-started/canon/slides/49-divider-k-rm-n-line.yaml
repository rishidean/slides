speaker_notes: >-
  One hundred kilometers up, the air runs out and wings stop working. Flying becomes orbiting, and
  staying up takes a different kind of craft. Everything I've shown you so far works because the air
  was thick enough to push against, which is another way of saying the problem was one you already
  knew how to describe. Past this line, you don't.
