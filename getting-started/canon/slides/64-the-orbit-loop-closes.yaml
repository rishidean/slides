speaker_notes: >-
  The air loop runs; the orbit loop closes. In chapter two you fed the harness better specs and it
  built better code, and every run started cold: corrections died with the session, and the 401st
  request cost exactly what the first one did. Here the system feeds itself. It runs, watches what
  happened, promotes what held, and the next run starts smarter than the last one. Nobody edited a
  file to make that happen.
