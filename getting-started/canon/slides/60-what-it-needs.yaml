speaker_notes: >-
  Three requirements, one for each crack. Remember, so a session doesn't start cold: a place to keep
  what it learns, sorted by how fast it changes. Observe, so a decision can be audited: one front
  door for every action, logged and replayable. And compile, so the curve bends: a way to graduate a
  repeated answer into a rule.
