speaker_notes: >-
  Three sprints build in sequence, with QA gating each one. S2 is the payoff. QA catches the planted
  matching-timer double-fire, two timers racing to assign a driver in violation of BR-007, the
  verdict comes back RED, the Builder reads the failure, fixes it, and re-runs to GREEN. Nobody at
  the keyboard for any of it.
