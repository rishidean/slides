speaker_notes: >-
  Four things to take with you. A shared vocabulary, so when someone says AI coding you can ask
  which rung they mean. A way to get airborne, which is a Friday rather than a quarter. An honest
  read on jet and rocket, both real and neither finished. And the fourth is why you talk to each
  other after this.
