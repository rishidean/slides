speaker_notes: >-
  Most of us are sitting right here. You've adopted Claude, Copilot, AI-native workflows, and that's
  real; it's also still ground transport. Driving buys you 10 or 20 percent, nowhere near the 10x
  the solo builders are getting, and the difference is mode of transport rather than talent.
