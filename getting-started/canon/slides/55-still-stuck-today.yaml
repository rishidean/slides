speaker_notes: >-
  Build it today and you would still be stuck. Put a modern agent on Kormo, airborne mode, the
  harness we just built, and parts of it do get better; the model reads a messy CV that a rules
  engine never could. It still guesses from scratch every time, forgets between sessions, and can't
  show its work. Same wound, better model.
