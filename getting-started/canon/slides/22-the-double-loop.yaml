speaker_notes: >-
  One loop inside another. The outer loop marches through sprints with a fresh brain each time. The
  inner loop is a single session doing build, QA, and document. RED sends it back to fix and
  re-check; GREEN ticks the manifest, writes a handoff, and the outer loop moves on.
