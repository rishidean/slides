speaker_notes: >-
  Look at who owns each level. Walking through driving is IT territory; they buy the tools and roll
  them out. Nobody can buy your way to helicopter, because that level belongs to the people doing
  the work. The org gets airborne when the team system changes together, and whoever crosses first
  ends up pulling everyone else up.
