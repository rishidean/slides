speaker_notes: >-
  I had never pressed the button, so the one time I half-tried it the output felt wrong, so I
  decided it must be the car, so of course I knew I couldn't rely on it, so I did the work myself.
  Round it went, for months. The general form is on the slide: low proficiency produces
  disappointing output, distrust hardens, confirmation bias sets in, and you retreat to the old way,
  which costs you the reps that would have raised proficiency. Skepticism reads as rigor and retreat
  reads as responsibility, and underneath both of them sits a skills gap. Distrust is a status
  report on your scaffolding.
